#:schema https://fnox.jdx.dev/schema.json
# 手元で使う secret。値は age で recipients 全員の公開鍵宛てに暗号化して commit する（平文は置かない）。
# 鍵は auth 専用（個人の他の secret を開ける鍵は使わない）。手順は home repo（fudoki-hensansitu/home）の secrets skill を参照。
# ここには preview（staging）の WorkOS の値だけを置き、本番の key は Cloudflare の Worker secret に置く。
default_provider = "age"
# fnox activate の shell には export せず、fnox exec の command にだけ渡す
env = "exec"

# 各自の auth 用の age 秘密鍵は OS の keychain（service = fnox-auth、account = age-key）に置く。
[providers.keychain]
type = "keychain"
service = "fnox-auth"

[providers.age]
type = "age"
# 1 行 1 人。行末のコメントで誰の鍵かを示す（fnox 1.46 は名前付きの表を読めない）。
# メンバーを足す・外したら `fnox reencrypt -p age` で暗号文を作り直す。
recipients = [
  "age1yrkxmsrarqy386eks88azf2p2hf8r8457hatkcl5c40zp057rpjqjxffwc", # yuito（auth 専用）
  "age13hmtdl2v0ad55uq9djhfn88tmym00ggkrlduj8m5cpxy0tys8qjs2kh706", # ai（cloud agent 用。cloud 環境の FNOX_AGE_KEY）
]
# 復号の鍵は keychain から読む。FNOX_AGE_KEY が export されているとそちらが優先される。
identity = { provider = "keychain", value = "age-key" }

[secrets]
WORKOS_CLIENT_ID= { provider = "age", value = "" }
WORKOS_COOKIE_PASSWORD= { provider = "age", value = "" }
